<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F2F4EF">
<title>Phase 0 練習包 — 英日雙語</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F2F4EF; --surface:#FFFFFF; --ink:#1B2A22; --ink-2:#5C6A62; --rule:#D3D9D0;
    --blue:#2148A6; --blue-soft:#E4EAF8; --marker:#F7DE5F; --marker-soft:#FBF1B8;
    --red:#C2372C; --red-soft:#F9E3E0; --green:#2E7D4F; --green-soft:#DFF0E5;
    --en:'Atkinson Hyperlegible', 'Helvetica Neue', Arial, sans-serif;
    --zh:-apple-system, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
    --nav-h:60px; --bar-h:72px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--zh);font-size:16px;line-height:1.5}
  body{min-height:100dvh;touch-action:manipulation}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  input,textarea,select{font:inherit;color:inherit}
  .en{font-family:var(--en)}
  #app{max-width:560px;margin:0 auto;min-height:100dvh}

  /* ---------- screens with nav ---------- */
  .screen{padding:20px 18px calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px)}
  h1{font-size:34px;line-height:1.1;margin:0;font-weight:700;letter-spacing:-.01em}
  h2{font-size:20px;margin:28px 0 10px;font-weight:700}
  .muted{color:var(--ink-2)}
  .small{font-size:14px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px}

  /* the 11-segment day strip */
  .strip{display:grid;grid-template-columns:repeat(11,1fr);gap:3px;height:10px;margin:14px 0 6px}
  .strip i{display:block;background:var(--rule);border-radius:2px}
  .strip i.done{background:var(--green)}
  .strip i.part{background:var(--marker)}
  .strip.mini{height:5px;margin:0;gap:2px}

  .primary{display:block;width:100%;background:var(--blue);color:#fff;border-radius:12px;padding:16px;font-size:17px;font-weight:700;text-align:center;min-height:52px}
  .primary:disabled{background:var(--rule);color:var(--ink-2)}
  .secondary{display:block;width:100%;background:var(--surface);border:1.5px solid var(--rule);border-radius:12px;padding:15px;font-size:17px;font-weight:700;text-align:center;min-height:52px}
  .ghost{color:var(--blue);font-weight:700;padding:10px 4px;min-height:44px}
  .primary:focus-visible,.secondary:focus-visible,.ghost:focus-visible,.opt:focus-visible,.chip:focus-visible{outline:3px solid var(--marker);outline-offset:2px}

  .blocks{margin:22px 0 0;padding:0;list-style:none;border-top:1px solid var(--rule)}
  .blocks li{border-bottom:1px solid var(--rule)}
  .blocks button{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:14px;width:100%;padding:14px 4px;text-align:left;min-height:56px}
  .blocks .name{font-weight:700}
  .blocks .n{color:var(--ink-2);font-variant-numeric:tabular-nums}
  .blocks .st{min-width:78px;text-align:right;font-variant-numeric:tabular-nums}
  .st.done{color:var(--green);font-weight:700}
  .st.part{color:var(--ink);background:var(--marker-soft);padding:2px 8px;border-radius:6px}
  .st.todo{color:var(--ink-2)}
  .daynav{display:flex;justify-content:space-between;margin-top:18px}

  /* ---------- bottom nav ---------- */
  #nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--surface);border-top:1px solid var(--rule);display:flex;z-index:20}
  #nav>div{max-width:560px;margin:0 auto;width:100%;display:flex}
  #nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--ink-2);min-height:var(--nav-h)}
  #nav button.on{color:var(--blue);font-weight:700}
  #nav button.on::before{content:"";width:22px;height:3px;border-radius:2px;background:var(--blue);margin-bottom:4px}
  #nav button::before{content:"";width:22px;height:3px;margin-bottom:4px}
  #nav.hidden{display:none}

  /* ---------- runner ---------- */
  #runner{position:fixed;inset:0;background:var(--paper);z-index:30;display:flex;flex-direction:column}
  #runner.hidden{display:none}
  .r-head{padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:var(--paper)}
  .r-head .row{margin-bottom:8px}
  .r-head .title{font-weight:700;font-size:17px}
  .r-head .x{width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:22px;margin-left:-10px}
  .r-head .count{font-variant-numeric:tabular-nums;color:var(--ink-2)}
  .bar{height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
  .bar b{display:block;height:100%;background:var(--blue);transition:width .25s}
  .r-body{flex:1;overflow:auto;padding:18px 18px calc(var(--bar-h) + env(safe-area-inset-bottom) + 20px);max-width:560px;width:100%;margin:0 auto}
  .r-foot{position:fixed;left:0;right:0;bottom:0;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--rule);display:flex;gap:10px;z-index:31}
  .r-foot>*{flex:1}
  .r-foot .primary,.r-foot .secondary{width:auto}

  .q{font-family:var(--en);font-size:24px;line-height:1.35;margin:8px 0 22px;word-break:break-word}
  .q.zh{font-family:var(--zh);font-size:22px}
  .blank{display:inline-block;min-width:70px;border-bottom:2px solid var(--ink);margin:0 4px;text-align:center}
  .blank.filled{background:var(--marker-soft);border-bottom-color:var(--blue)}
  .hint{color:var(--ink-2);font-size:14px;margin-top:8px}
  .field{width:100%;font-size:18px;font-family:var(--en);padding:14px;border:1.5px solid var(--rule);border-radius:12px;background:var(--surface);min-height:54px}
  .field:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
  textarea.field{min-height:150px;resize:vertical;line-height:1.5}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;align-items:center;gap:12px;background:var(--surface);border:1.5px solid var(--rule);border-radius:12px;padding:14px 16px;min-height:54px;text-align:left;font-family:var(--en);font-size:19px}
  .opt.zh{font-family:var(--zh);font-size:18px}
  .opt .k{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--rule);display:flex;align-items:center;justify-content:center;font-size:13px;flex:none;color:var(--ink-2)}
  .opt.sel{border-color:var(--blue);background:var(--marker-soft)}
  .opt.right{border-color:var(--green);background:var(--green-soft)}
  .opt.wrong{border-color:var(--red);background:var(--red-soft)}
  .opt:disabled{cursor:default}

  .words{display:flex;flex-wrap:wrap;gap:8px}
  .chip{font-family:var(--en);font-size:19px;background:var(--surface);border:1.5px solid var(--rule);border-radius:10px;padding:10px 14px;min-height:46px}
  .chip.used{opacity:.25}
  .chip.sel{background:var(--marker);border-color:var(--marker)}
  .chip.bad{background:var(--red-soft);border-color:var(--red)}
  .slot{min-height:64px;border:1.5px dashed var(--rule);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;background:rgba(255,255,255,.5)}
  .slot:empty::after{content:"點下方的字，依序拼成句子";color:var(--ink-2);font-size:14px;padding:8px}

  .tap-words{display:flex;flex-wrap:wrap;gap:6px 4px;font-family:var(--en);font-size:23px;line-height:1.4}
  .tap-words button{padding:4px 5px;border-radius:6px;min-height:40px}
  .tap-words button.sel{background:var(--marker)}
  .tap-words button.wrong{background:var(--red-soft);text-decoration:line-through;color:var(--red)}
  .tap-words button.fixed{background:var(--green-soft);color:var(--green);font-weight:700}

  .fb{margin-top:20px;padding:14px 16px;border-radius:12px;animation:pop .18s ease-out}
  .fb.ok{background:var(--green-soft);color:var(--green)}
  .fb.no{background:var(--red-soft);color:var(--red)}
  .fb strong{display:block;font-size:17px}
  .fb .ans{font-family:var(--en);font-size:19px;margin-top:4px}
  .fb .why{color:var(--ink);margin-top:6px;font-size:15px}
  @keyframes pop{from{transform:scale(.98);opacity:0}to{transform:none;opacity:1}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  .card{background:var(--surface);border:1.5px solid var(--rule);border-radius:16px;padding:22px 20px}
  .card .w{font-family:var(--en);font-size:38px;font-weight:700;line-height:1.1}
  .card .pos{color:var(--ink-2);font-family:var(--en)}
  .card .zh{font-size:22px;margin:10px 0}
  .card .ex{font-family:var(--en);font-size:18px;color:var(--ink-2);margin-top:14px;border-top:1px solid var(--rule);padding-top:12px}
  .tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:6px;background:var(--blue-soft);color:var(--blue);vertical-align:middle;margin-left:8px}

  .spk{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--rule);border-radius:999px;padding:10px 16px;font-weight:700;min-height:46px}
  .spk.on{border-color:var(--blue);background:var(--blue-soft)}
  .spkrow{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 18px}

  details.passage{background:var(--surface);border:1.5px solid var(--rule);border-radius:12px;margin-bottom:18px}
  details.passage summary{padding:12px 16px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
  details.passage summary::after{content:"展開";color:var(--blue);font-weight:400;font-size:14px}
  details.passage[open] summary::after{content:"收合"}
  details.passage .t{font-family:var(--en);font-size:18px;line-height:1.6;padding:0 16px 16px}

  .rate{display:flex;gap:10px}
  .rate button{flex:1;border:1.5px solid var(--rule);background:var(--surface);border-radius:12px;padding:14px;font-weight:700;min-height:54px}
  .rate button.sel{background:var(--marker);border-color:var(--marker)}

  .done-box{text-align:center;padding:30px 0 10px}
  .done-box .big{font-size:56px;font-weight:700;line-height:1}
  .wrongs{margin:20px 0;padding:0;list-style:none}
  .wrongs li{padding:10px 0;border-top:1px solid var(--rule);font-size:15px}
  .wrongs .en{font-size:17px}

  /* ---------- progress grid ---------- */
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
  .cell{aspect-ratio:1;border-radius:8px;background:var(--surface);border:1.5px solid var(--rule);position:relative;display:flex;align-items:flex-end;justify-content:center;font-size:12px;color:var(--ink-2);overflow:hidden;padding:0}
  .cell b{position:absolute;left:0;right:0;bottom:0;background:var(--green-soft);z-index:0}
  .cell span{position:relative;z-index:1;padding-bottom:3px}
  .cell.today{border-color:var(--blue);border-width:2px;color:var(--blue);font-weight:700}
  .cell.future{opacity:.45}
  .cell.full b{background:var(--green)}
  .cell.full span{color:#fff}
  .legend{display:flex;gap:16px;margin-top:10px;font-size:13px;color:var(--ink-2)}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}

  /* ---------- lists / settings ---------- */
  .list{list-style:none;padding:0;margin:14px 0 0;border-top:1px solid var(--rule)}
  .list li{border-bottom:1px solid var(--rule)}
  .list button,.list label{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:14px 4px;text-align:left;min-height:56px}
  .list .sub{font-size:13px;color:var(--ink-2)}
  .seg{display:flex;border:1.5px solid var(--rule);border-radius:10px;overflow:hidden}
  .list label>span:first-child{flex:1;min-width:0}
  .seg{flex:none}
  .seg button{padding:8px 11px;min-height:40px;border-left:1.5px solid var(--rule);white-space:nowrap}
  .seg button:first-child{border-left:0}
  .seg button.sel{background:var(--marker)}
  select.sel-input{max-width:200px;padding:8px;border:1.5px solid var(--rule);border-radius:8px;background:var(--surface)}
  input[type=range]{width:150px}
  .note{background:var(--marker-soft);padding:12px 14px;border-radius:10px;font-size:14px;margin-top:14px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  .ext-form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  .ext-form .field{font-family:var(--zh);font-size:16px;min-height:48px;padding:10px 12px}
  .ext-form .full{grid-column:1/-1}
  .tbl{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
  .tbl td,.tbl th{padding:8px 4px;border-bottom:1px solid var(--rule);text-align:left}
  .tbl th{color:var(--ink-2);font-weight:400}
  .gp{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--rule)}
  .gp.low{color:var(--red);font-weight:700}
  /* ---------- 英日雙語 ---------- */
  :root{ --serif:'Source Serif 4', Georgia, 'Times New Roman', serif; --jp:'Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif; --jps:-apple-system,'Hiragino Sans','Noto Sans JP','PingFang TC',sans-serif; --tr:#A8432F; --hl:#F6C9C0; }
  .jp{font-family:var(--jps)}
  ruby{ruby-position:over} rt{font-size:.5em;color:var(--ink-2);font-weight:400;letter-spacing:0}
  .jtok{display:inline}
  .jgap .jtok{margin-right:.18em}
  .romaji{font-family:var(--en);font-size:.62em;color:var(--ink-2);margin-top:4px;line-height:1.4}
  .langsw{display:flex;gap:0;border:1.5px solid var(--rule);border-radius:999px;overflow:hidden;width:max-content;margin-bottom:14px;background:var(--surface)}
  .langsw button{padding:8px 16px;min-height:40px;font-weight:700;color:var(--ink-2)}
  .langsw button.sel{background:var(--ink);color:#fff}
  .q.jp{font-size:26px;line-height:2.1}
  .opt.jp{font-family:var(--jps);font-size:20px}
  .kana-big{font-family:var(--jps);font-size:96px;line-height:1.1;text-align:center;margin:10px 0 18px}
  .chip.jp{font-family:var(--jps);font-size:20px}
  .zhhint{color:var(--ink-2);font-size:15px;margin-bottom:6px}
  .card .ja{font-family:var(--jps);font-size:20px;margin-top:6px;color:var(--ink)}
  .card .ja small{color:var(--ink-2);font-size:13px;margin-right:6px}

  /* 書架 */
  .goal{display:flex;align-items:center;gap:14px;margin:12px 0 18px}
  .goal svg{flex:none}
  .goal b{font-size:22px}
  .lv{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
  .lv button{border:1.5px solid var(--rule);border-radius:999px;padding:6px 12px;min-height:36px;font-size:14px;background:var(--surface)}
  .lv button.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
  .lv button.empty{opacity:.45}
  .books{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .book{text-align:left;display:flex;flex-direction:column;gap:8px}
  .cover{aspect-ratio:3/4;border-radius:6px 12px 12px 6px;padding:14px 12px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;position:relative;overflow:hidden;box-shadow:inset 6px 0 0 rgba(0,0,0,.18)}
  .cover .ct{font-family:var(--serif);font-size:21px;line-height:1.15;font-weight:600;padding-right:28px;margin-top:14px}
  .cover.ja .ct{font-family:var(--jp);font-size:22px}
  .cover .ca{font-size:11px;opacity:.85}
  .cover .lvb{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.92);color:var(--ink);font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px}
  .book .bt{font-weight:700;font-size:15px;line-height:1.3}
  .book .bp{font-size:12px;color:var(--ink-2)}
  .pbar{height:4px;background:var(--rule);border-radius:2px;overflow:hidden}.pbar b{display:block;height:100%;background:var(--green)}
  .wl{list-style:none;padding:0;margin:8px 0 0;border-top:1px solid var(--rule)}
  .wl li{display:flex;justify-content:space-between;align-items:center;padding:10px 2px;border-bottom:1px solid var(--rule);gap:10px}
  .wl .w1{font-family:var(--serif);font-size:18px}.wl .w1.jp{font-family:var(--jps)}
  .wl .w2{font-size:13px;color:var(--ink-2);text-align:right}

  /* 閱讀器 */
  #reader{position:fixed;inset:0;z-index:25;display:flex;flex-direction:column;background:#F4EFE6}
  #reader.hidden{display:none}
  .rd-head{padding:calc(8px + env(safe-area-inset-top)) 10px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px;max-width:620px;margin:0 auto;width:100%}
  .rd-head .t{font-weight:700;text-align:center;flex:1;font-size:15px;line-height:1.25}
  .rd-head .t small{display:block;font-weight:400;color:var(--ink-2);font-size:12px}
  .rd-head button{width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:20px}
  .modes{display:flex;gap:8px;justify-content:center;padding:4px 14px 10px}
  .modes button{flex:1;max-width:120px;border-radius:999px;padding:8px 0;font-weight:700;font-size:15px;background:rgba(168,67,47,.12);color:var(--tr);min-height:40px}
  .modes button.sel{background:var(--tr);color:#fff}
  .rd-body{flex:1;overflow:auto;padding:6px 20px calc(110px + env(safe-area-inset-bottom));max-width:620px;margin:0 auto;width:100%;-webkit-overflow-scrolling:touch}
  .chap-t{font-family:var(--serif);font-size:26px;font-weight:600;margin:12px 0 2px}
  .chap-t.jp{font-family:var(--jp)}
  .chap-s{color:var(--ink-2);font-size:14px;margin-bottom:18px}
  .sent{position:relative;padding:6px 36px 6px 8px;margin:0 -8px 6px;border-radius:8px;transition:background .2s}
  .sent.cur{background:rgba(247,222,95,.38)}
  .sent .tr{color:var(--tr);font-size:16px;line-height:1.55;margin-bottom:2px}
  .sent .tx{font-family:var(--serif);font-size:var(--rdfs,22px);line-height:1.55;color:#231f1a}
  .sent .tx.jp{font-family:var(--jp);line-height:2.15}
  .sent .tx .w{cursor:pointer;border-radius:3px;padding:0 1px}
  .sent .tx .w:active{background:var(--marker)}
  .sent .tx .w.saved{background:var(--hl)}
  .sent .tx .w.on{background:var(--marker)}
  .sent .sp{position:absolute;right:-4px;bottom:4px;width:34px;height:34px;font-size:15px;opacity:.55}
  .rd-end{margin:26px 0 10px;text-align:center}
  .player{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--rule);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:26}
  .player>div{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:6px}
  .player button{min-width:44px;height:44px;font-size:19px;display:flex;align-items:center;justify-content:center;border-radius:10px}
  .player .pp{width:52px;height:52px;border-radius:50%;background:var(--tr);color:#fff;font-size:20px}
  .player .spd{font-size:14px;font-weight:700;border:1.5px solid var(--rule);padding:0 10px}
  .player .tm{margin-left:auto;font-size:13px;color:var(--ink-2);text-align:right;line-height:1.3}

  /* 單字面板 */
  #sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(27,42,34,.28)}
  #sheet.hidden{display:none}
  .sh{background:var(--surface);width:100%;max-width:620px;border-radius:18px 18px 0 0;padding:10px 20px calc(18px + env(safe-area-inset-bottom));animation:up .18s ease-out;max-height:80dvh;overflow:auto}
  @keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
  .sh .grab{width:38px;height:4px;border-radius:2px;background:var(--rule);margin:0 auto 12px}
  .sh .hw{font-family:var(--serif);font-size:34px;font-weight:600;line-height:1.2}
  .sh .hw.jp{font-family:var(--jps);font-size:32px}
  .sh .ph{color:var(--ink-2);font-family:var(--en);margin:2px 0 10px}

and I am alone.\"", "zh": "「請來我家。我生病了，而且我一個人。」", "ja": "「どうか私の家に来てください。私は病気で、一人です。」"}, {"t": "I go to his house on a cold, dark day.", "zh": "在一個寒冷、陰暗的日子，我去了他家。", "ja": "寒くて暗い日に、私は彼の家へ行きます。"}, {"t": "The sky is grey. The trees are dead.", "zh": "天空是灰色的。樹都枯死了。", "ja": "空は灰色です。木は枯れています。"}, {"t": "The house is big and very old.", "zh": "房子很大，而且非常老舊。", "ja": "家は大きくて、とても古いです。"}, {"t": "There is a long crack in the wall.", "zh": "牆上有一道長長的裂縫。", "ja": "壁に長いひびがあります。"}, {"t": "I am afraid, but I go in.", "zh": "我很害怕，但我還是走了進去。", "ja": "私は怖いですが、中に入ります。"}, {"t": "A servant takes me to Roderick's room.", "zh": "一個僕人帶我去羅德里克的房間。", "ja": "使用人が私をロデリックの部屋へ連れて行きます。"}], "qs": [{"q": "Who is Roderick Usher?", "opts": ["The writer's friend", "The writer's brother", "A doctor", "A servant"], "a": 0}, {"q": "What is in the wall?", "opts": ["A window", "A long crack", "A door", "A picture"], "a": 1}, {"q": "How is the writer at the house?", "opts": ["Happy", "Hungry", "Afraid", "Busy"], "a": 2}]}, {"title": "My Old Friend", "zh": "我的老朋友", "s": [{"t": "Roderick is very thin and his face is pale.", "zh": "羅德里克非常瘦，臉色蒼白。", "ja": "ロデリックはとてもやせていて、顔が青白いです。"}, {"t": "His eyes are big and his hands shake.", "zh": "他的眼睛很大，雙手在發抖。", "ja": "彼の目は大きく、手が震えています。"}, {"t": "\"Thank you for coming, my friend,\" he says.", "zh": "「謝謝你來，我的朋友。」他說。", "ja": "「来てくれてありがとう、友よ」と彼は言います。"}, {"t": "His voice is low and full of fear.", "zh": "他的聲音低沉，充滿恐懼。", "ja": "彼の声は低く、恐怖でいっぱいです。"}, {"t": "\"This house has a strange power over me,\" he says.", "zh": "「這棟房子對我有一種奇怪的力量。」他說。", "ja": "「この家は私に不思議な力を持っている」と彼は言います。"}, {"t": "\"I cannot leave it.\"", "zh": "「我無法離開它。」", "ja": "「私はここを離れられない。」"}, {"t": "He has a sister. Her name is Madeline.", "zh": "他有一個妹妹。她的名字是瑪德琳。", "ja": "彼には妹がいます。彼女の名前はマデリンです。"}, {"t": "She is very sick, and the doctors cannot help her.", "zh": "她病得很重，醫生們都幫不了她。", "ja": "彼女は重い病気で、医者たちは彼女を助けられません。"}, {"t": "I see her for a moment. She is white like snow.", "zh": "我看見她一下子。她白得像雪。", "ja": "私は一瞬彼女を見ます。彼女は雪のように白いです。"}, {"t": "Then she is gone, and Roderick cries.", "zh": "然後她就不見了，羅德里克哭了。", "ja": "そして彼女はいなくなり、ロデリックは泣きます。"}], "qs": [{"q": "How are Roderick's hands?", "opts": ["They are big", "They shake", "They are cold", "They are clean"], "a": 1}, {"q": "Who is Madeline?", "opts": ["Roderick's mother", "A doctor", "Roderick's sister", "The writer's wife"], "a": 2}, {"q": "What can the doctors do?", "opts": ["They cannot help her", "They help her", "They take her home", "They are not there"], "a": 0}]}, {"title": "The Storm", "zh": "暴風雨", "s": [{"t": "A few days later, Roderick is very sad. \"My sister is dead,\" he says.", "zh": "幾天後，羅德里克非常難過。「我妹妹死了。」他說。", "ja": "数日後、ロデリックはとても悲しんでいます。「妹が死んだ」と彼は言います。"}, {"t": "We put her body in a room under the house.", "zh": "我們把她的遺體放在房子下面的一個房間裡。", "ja": "私たちは彼女の体を家の下の部屋に置きます。"}, {"t": "One night there is a big storm.", "zh": "有一天晚上，來了一場大暴風雨。", "ja": "ある夜、大きな嵐が来ます。"}, {"t": "The wind is loud, and Roderick cannot sleep.", "zh": "風聲很大，羅德里克睡不著。", "ja": "風の音が大きく、ロデリックは眠れません。"}, {"t": "I read a book to him, but we hear a strange sound.", "zh": "我唸書給他聽，但我們聽到一個奇怪的聲音。", "ja": "私は彼に本を読みますが、私たちは不思議な音を聞きます。"}, {"t": "\"She is not dead!\" Roderick shouts. \"She is at the door!\"", "zh": "「她沒有死！」羅德里克大喊。「她在門口！」", "ja": "「彼女は死んでいない！」とロデリックは叫びます。「ドアのところにいる！」"}, {"t": "The door opens. Madeline is there, in her white dress.", "zh": "門開了。瑪德琳就在那裡，穿著她的白色洋裝。", "ja": "ドアが開きます。白いドレスを着たマデリンがそこにいます。"}, {"t": "She falls on her brother, and they both die.", "zh": "她倒在哥哥身上，兩個人都死了。", "ja": "彼女は兄の上に倒れ、二人とも死にます。"}, {"t": "I run out of the house into the storm.", "zh": "我跑出房子，衝進暴風雨中。", "ja": "私は家から嵐の中へ走り出ます。"}, {"t": "Behind me, the crack opens and the old house falls into the dark lake.", "zh": "在我身後，裂縫裂開，老房子倒進了黑暗的湖裡。", "ja": "私の後ろで、ひびが開き、古い家は暗い湖の中へ崩れ落ちます。"}], "qs": [{"q": "Where do they put Madeline's body?", "opts": ["In the garden", "In a room under the house", "In the lake", "In her bedroom"], "a": 1}, {"q": "What is at the door?", "opts": ["A servant", "The doctor", "Madeline", "The wind"], "a": 2}, {"q": "What happens to the house?", "opts": ["It falls into the lake", "It is clean", "It is new", "Nothing"], "a": 0}]}]}, {"id": "gift", "lang": "en", "title": "The Gift", "sub": "禮物", "level": "A1", "author": "O. Henry（改寫）", "color": ["#5a2d2d", "#c9a46a"], "chapters": [{"title": "One Dollar and Eighty-Seven Cents", "zh": "一塊八毛七", "s": [{"t": "Della has one dollar and eighty-seven cents.", "zh": "黛拉有一塊八毛七分錢。", "ja": "デラは1ドル87セントを持っています。"}, {"t": "Tomorrow is Christmas.", "zh": "明天是聖誕節。", "ja": "明日はクリスマスです。"}, {"t": "She wants to buy a gift for her husband, Jim.", "zh": "她想買一份禮物給她的丈夫吉姆。", "ja": "彼女は夫のジムにプレゼントを買いたいです。"}, {"t": "But she does not have much money.", "zh": "但是她沒有很多錢。", "ja": "でも、彼女はあまりお金を持っていません。"}, {"t": "Della and Jim are poor, but they are happy.", "zh": "黛拉和吉姆很窮，但他們很快樂。", "ja": "デラとジムは貧しいですが、幸せです。"}, {"t": "They have two beautiful things.", "zh": "他們有兩樣美麗的東西。", "ja": "二人には美しい物が二つあります。"}, {"t": "Jim has a gold watch. It was his father's watch.", "zh": "吉姆有一支金錶。那是他父親的錶。", "ja": "ジムは金の時計を持っています。それは彼の父の時計でした。"}, {"t": "Della has long, beautiful hair.", "zh": "黛拉有一頭美麗的長髮。", "ja": "デラは長くて美しい髪をしています。"}, {"t": "Her hair is brown and it shines like water.", "zh": "她的頭髮是棕色的，像水一樣閃閃發亮。", "ja": "彼女の髪は茶色で、水のように輝きます。"}, {"t": "Della looks in the mirror and has an idea.", "zh": "黛拉照了照鏡子，想到一個主意。", "ja": "デラは鏡を見て、あることを思いつきます。"}], "qs": [{"q": "What day is tomorrow?", "opts": ["Her birthday", "Christmas", "Monday", "Jim's birthday"], "a": 1}, {"q": "What does Jim have?", "opts": ["A gold watch", "A car", "Long hair", "A big house"], "a": 0}, {"q": "What color is Della's hair?", "opts": ["Black", "Yellow", "Brown", "Red"], "a": 2}]}, {"title": "Della's Idea", "zh": "黛拉的主意", "s": [{"t": "Della goes to a shop. The shop buys hair.", "zh": "黛拉去了一家店。那家店收購頭髮。", "ja": "デラは店に行きます。その店は髪を買います。"}, {"t": "\"I want to sell my hair,\" she says.", "zh": "「我想賣掉我的頭髮。」她說。", "ja": "「髪を売りたいです」と彼女は言います。"}, {"t": "The woman in the shop looks at her hair. \"Twenty dollars,\" she says.", "zh": "店裡的女人看了看她的頭髮。「二十塊。」她說。", "ja": "店の女の人は彼女の髪を見ます。「20ドル」と言います。"}, {"t": "Now Della has short hair, but she has money.", "zh": "現在黛拉是短髮了，但她有錢了。", "ja": "今、デラの髪は短いですが、お金があります。"}, {"t": "She looks in many shops for a gift.", "zh": "她在很多家店裡找禮物。", "ja": "彼女はたくさんの店でプレゼントを探します。"}, {"t": "Then she finds it: a gold chain for Jim's watch.", "zh": "然後她找到了：一條配吉姆手錶的金鍊子。", "ja": "そして見つけます。ジムの時計のための金の鎖です。"}, {"t": "It is simple and beautiful, like Jim.", "zh": "它簡單又美麗，就像吉姆一樣。", "ja": "それはジムのように、シンプルで美しいです。"}, {"t": "At home, she looks at her short hair in the mirror.", "zh": "在家裡，她在鏡子裡看著自己的短髮。", "ja": "家で、彼女は鏡で短い髪を見ます。"}, {"t": "\"Please, God, make Jim think I am still pretty,\" she says.", "zh": "「上帝啊，請讓吉姆覺得我還是很漂亮。」她說。", "ja": "「神様、どうかジムが私をまだかわいいと思いますように」と彼女は言います。"}, {"t": "Then she hears Jim at the door.", "zh": "然後她聽到吉姆在門口。", "ja": "そして、ドアのところにジムの音が聞こえます。"}], "qs": [{"q": "What does Della sell?", "opts": ["Her watch", "Her hair", "Her dress", "Her book"], "a": 1}, {"q": "How much money does she get?", "opts": ["Twenty dollars", "Two dollars", "One dollar", "Eighty dollars"], "a": 0}, {"q": "What gift does she buy?", "opts": ["A comb", "A hat", "A gold chain", "A book"], "a": 2}]}, {"title": "Two Gifts", "zh": "兩份禮物", "s": [{"t": "Jim comes in and looks at Della. He does not speak.", "zh": "吉姆走進來看著黛拉。他沒有說話。", "ja": "ジムは入ってきてデラを見ます。彼は何も言いません。"}, {"t": "\"Jim, I sold my hair,\" she says. \"It grows fast. Look at your gift!\"", "zh": "「吉姆，我賣掉了我的頭髮。」她說。「頭髮長得很快。看看你的禮物！」", "ja": "「ジム、髪を売ったの」と彼女は言います。「髪はすぐ伸びるわ。あなたのプレゼントを見て！」"}, {"t": "Jim gives her a small box.", "zh": "吉姆給她一個小盒子。", "ja": "ジムは彼女に小さな箱を渡します。"}, {"t": "In the box, there are two beautiful combs for her long hair.", "zh": "盒子裡有兩把美麗的梳子，是給她的長髮用的。", "ja": "箱の中には、彼女の長い髪のための美しいくしが二つあります。"}, {"t": "Della loves the combs, but now her hair is short.", "zh": "黛拉很愛那兩把梳子，但現在她的頭髮是短的。", "ja": "デラはくしが大好きですが、今は髪が短いです。"}, {"t": "She gives Jim the chain. \"Give me your watch,\" she says.", "zh": "她把鍊子給吉姆。「把你的錶給我。」她說。", "ja": "彼女はジムに鎖を渡します。「時計をちょうだい」と彼女は言います。"}, {"t": "Jim smiles. \"I sold my watch,\" he says. \"I bought your combs with the money.\"", "zh": "吉姆笑了。「我賣掉了我的錶。」他說。「我用那筆錢買了你的梳子。」", "ja": "ジムはほほえみます。「時計を売ったんだ」と彼は言います。「そのお金で君のくしを買ったんだ。」"}, {"t": "They do not have the watch, and they do not have the long hair.", "zh": "他們沒有那支錶了，也沒有那頭長髮了。", "ja": "二人には時計も、長い髪もありません。"}, {"t": "But they have love, and love is the best gift.", "zh": "但是他們有愛，而愛是最好的禮物。", "ja": "でも、二人には愛があります。そして愛は一番の贈り物です。"}, {"t": "They are the wisest people of all.", "zh": "他們是所有人當中最有智慧的人。", "ja": "二人は誰よりも賢い人たちです。"}], "qs": [{"q": "What is in Jim's box?", "opts": ["A watch", "Two combs", "A chain", "Money"], "a": 1}, {"q": "What did Jim sell?", "opts": ["His hair", "His car", "His watch", "His box"], "a": 2}, {"q": "What is the best gift?", "opts": ["Love", "Money", "A watch", "Hair"], "a": 0}]}]}], "ja": [{"id": "momotaro", "lang": "ja", "title": "桃太郎", "reading": "ももたろう", "sub": "桃太郎", "en": "Momotaro, the Peach Boy", "level": "N5", "author": "日本民間故事（改寫）", "color": ["#7a3b4a", "#f0b6a8"], "chapters": [{"title": "大きな 桃", "reading": "おおきな もも", "zh": "大桃子", "s": [{"toks": [["むかし", ""], ["むかし", ""], ["、", ""], ["おじいさん", ""], ["と", ""], ["おばあさん", ""], ["が", ""], ["いました", ""], ["。", ""]], "zh": "很久很久以前，有一位老爺爺和一位老奶奶。", "en": "Once upon a time, there was an old man and an old woman."}, {"toks": [["おじいさん", ""], ["は", ""], ["山", "やま"], ["へ", ""], ["行きました", "いきました"], ["。", ""]], "zh": "老爺爺去了山上。", "en": "The old man went to the mountain."}, {"toks": [["おばあさん", ""], ["は", ""], ["川", "かわ"], ["へ", ""], ["行きました", "いきました"], ["。", ""]], "zh": "老奶奶去了河邊。", "en": "The old woman went to the river."}, {"toks": [["川", "かわ"], ["に", ""], ["大きな", "おおきな"], ["桃", "もも"], ["が", ""], ["ありました", ""], ["。", ""]], "zh": "河裡有一顆大桃子。", "en": "There was a big peach in the river."}, {"toks": [["おばあさん", ""], ["は", ""], ["桃", "もも"], ["を", ""], ["家", "いえ"], ["へ", ""], ["持って", "もって"], ["帰りました", "かえりました"], ["。", ""]], "zh": "老奶奶把桃子帶回了家。", "en": "The old woman took the peach home."}, {"toks": [["桃", "もも"], ["の", ""], ["中", "なか"], ["に", ""], ["男の子", "おとこのこ"], ["が", ""], ["いました", ""], ["。", ""]], "zh": "桃子裡面有一個男孩。", "en": "There was a boy inside the peach."}, {"toks": [["二人", "ふたり"], ["は", ""], ["とても", ""], ["うれしかったです", ""], ["。", ""]], "zh": "兩個人非常高興。", "en": "The two of them were very happy."}, {"toks": [["男の子", "おとこのこ"], ["の", ""], ["名前", "なまえ"], ["は", ""], ["桃太郎", "ももたろう"], ["です", ""], ["。", ""]], "zh": "男孩的名字是桃太郎。", "en": "The boy's name is Momotaro."}], "qs": [{"q": [["おじいさん", ""], ["は", ""], ["どこ", ""], ["へ", ""], ["行きました", ""], ["か", ""], ["。", ""]], "opts": [[["山", "やま"]], [["川", "かわ"]], [["家", "いえ"]], [["村", "むら"]]], "a": 0, "zh": "老爺爺去了哪裡？"}, {"q": [["川", "かわ"], ["に", ""], ["何", "なに"], ["が", ""], ["ありました", ""], ["か", ""], ["。", ""]], "opts": [[["犬", "いぬ"]], [["桃", "もも"]], [["船", "ふね"]], [["鬼", "おに"]]], "a": 1, "zh": "河裡有什麼？"}]}, {"title": "三匹の 友達", "reading": "さんびきの ともだち", "zh": "三個朋友", "s": [{"toks": [["桃太郎", "ももたろう"], ["は", ""], ["大きく", "おおきく"], ["なりました", ""], ["。", ""]], "zh": "桃太郎長大了。", "en": "Momotaro grew up."}, {"toks": [["ある", ""], ["日", "ひ"], ["、", ""], ["鬼", "おに"], ["が", ""], ["村", "むら"], ["に", ""], ["来ました", "きました"], ["。", ""]], "zh": "有一天，鬼來到了村子。", "en": "One day, ogres came to the village."}, {"toks": [["桃太郎", "ももたろう"], ["は", ""], ["「", ""], ["鬼ヶ島", "おにがしま"], ["へ", ""], ["行きます", "いきます"], ["」", ""], ["と", ""], ["言いました", "いいました"], ["。", ""]], "zh": "桃太郎說：「我要去鬼島。」", "en": "Momotaro said, \"I will go to Ogre Island.\""}, {"toks": [["おばあさん", ""], ["は", ""], ["きびだんご", ""], ["を", ""], ["作りました", "つくりました"], ["。", ""]], "zh": "老奶奶做了吉備糰子。", "en": "The old woman made kibi dango."}, {"toks": [["道", "みち"], ["で", ""], ["犬", "いぬ"], ["に", ""], ["会いました", "あいました"], ["。", ""]], "zh": "在路上遇到了一隻狗。", "en": "On the road, he met a dog."}, {"toks": [["「", ""], ["きびだんご", ""], ["を", ""], ["ください", ""], ["。", ""], ["」", ""]], "zh": "「請給我吉備糰子。」", "en": "\"Please give me a kibi dango.\""}, {"toks": [["犬", "いぬ"], ["は",   return {kind:'part', n:items.length, done:p.done};
}
function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1800); }

/* =========================================================
   批改
========================================================= */
function norm(s){
  s = String(s||'').toLowerCase().replace(/[’‘`´]/g,"'").replace(/\s+/g,' ').trim().replace(/[.,!?;:]+$/,'').trim();
  for(const [c,f] of CONTR){ s = s.replace(new RegExp('(^|\\s)'+c.replace(/'/g,"'")+'(?=\\s|$)','g'), '$1'+f); }
  return s.replace(/\s+/g,' ').trim();
}
function match(user, answers){ const u = norm(user); return (Array.isArray(answers)?answers:[answers]).some(a => norm(a)===u); }

/* =========================================================
   語音
========================================================= */
const TTS = {
  voices:[], pick(){ const vs = speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)); this.voices=vs;
    if(state.settings.voice && vs.find(v=>v.name===state.settings.voice)) return;
    const pref = ['Samantha','Daniel','Karen','Moira','Google UK English Female','Google UK English Male','Google US English','Microsoft Aria','Microsoft Libby'];
    const v = pref.map(n=>vs.find(x=>x.name.includes(n))).find(Boolean) || vs[0];
    if(v) state.settings.voice = v.name;
  },
  speak(text, rate){
    if(!('speechSynthesis' in window)) return toast('此瀏覽器不支援朗讀');
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang='en-GB';
    const v = this.voices.find(x=>x.name===state.settings.voice); if(v) u.voice=v;
    u.rate = rate ?? state.settings.rate; speechSynthesis.speak(u);
  }
};
if('speechSynthesis' in window){ TTS.pick(); speechSynthesis.onvoiceschanged = ()=>{ TTS.pick(); if(state.screen==='settings') render(); }; }

}

/* =========================================================
   Runner（練習與考試共用）
========================================================= */
var startBlock = function(day, blockId){
  const items = itemsFor(day, blockId); if(!items.length) return;
  const b = BLOCKS.find(x=>x.id===blockId);
  openRunner({day, block:blockId, title:b.name, items:[...items], exam:false});
}
var openRunner = function(cfg){
  const p = cfg.exam ? {done:0,correct:0,skipped:[],answers:{}} : prog(cfg.day, cfg.block);
  state.runner = Object.assign({idx: Math.min(p.done, cfg.items.length), phase:'answer', tmp:{}, p, startedAt:Date.now(), wrongs:[], examAnswers:[]}, cfg);
  document.getElementById('nav').classList.add('hidden');
  document.getElementById('runner').classList.remove('hidden');
  renderRunner();
}
var closeRunner = function(){
  const r=state.runner; if(r && r.tmp.rec && r.tmp.rec.state==='recording') r.tmp.rec.stop();
  if(r && !r.exam){ r.p.done = r.idx; persist(); }
  state.runner=null; speechSynthesis?.cancel?.();
  document.getElementById('runner').classList.add('hidden');
  document.getElementById('nav').classList.remove('hidden');
  render();
}
function renderRunner(){
  const r=state.runner, el=document.getElementById('runner');
  if(r.idx>=r.items.length){ el.innerHTML = renderComplete(); return; }
  const item=r.items[r.idx], type=r.exam?'exam':r.block;
  const body = ITEM[type].render(item, r);
  el.innerHTML = `
    <div class="r-head"><div class="row"><button class="x" onclick="closeRunner()" aria-label="離開">✕</button><span class="title">${esc(r.title)}${r.exam?'<span class="tag">考試</span>':''}</span><span class="count">${r.idx+1}/${r.items.length}</span></div>
      <div class="bar"><b style="width:${(r.idx/r.items.length*100).toFixed(1)}%"></b></div></div>
    <div class="r-body">${body}${r.phase==='feedback'?renderFeedback():''}</div>
    <div class="r-foot">${renderFoot(type)}</div>`;
  const f = el.querySelector('[data-autofocus]'); if(f && r.phase==='answer') setTimeout(()=>f.focus(),50);
  const nb = el.querySelector('#next-btn'); if(nb) setTimeout(()=>nb.focus(),50);
}
function renderFoot(type){
  const r=state.runner;
  if(r.phase==='feedback') return `${r.last.ok||r.exam||!['translate','dictation','fill'].includes(r.block)?'':`<button class="secondary" onclick="markRight()">我覺得算對</button>`}<button id="next-btn" class="primary" onclick="nextItem()">${r.idx+1>=r.items.length?'完成':'下一題'}</button>`;
  const def = ITEM[type];
  if(def.foot) return def.foot(r);
  return `${r.exam?'':`<button class="secondary" onclick="skipItem()">跳過</button>`}<button class="primary" onclick="checkItem()">${r.exam?'下一題':'檢查答案'}</button>`;
}
function renderFeedback(){
  const {ok, ans, why} = state.runner.last;
  return `<div class="fb ${ok?'ok':'no'}"><strong>${ok?'✓ 正確':'✗ 正確答案'}</strong>${!ok&&ans?`<div class="ans">${esc(ans)}</div>`:''}${why?`<div class="why">${esc(why)}</div>`:''}</div>`;
}
function finish(ok, ans, why, userText){
  const r=state.runner, item=r.items[r.idx];
  r.last={ok, ans, why};
  if(!r.exam){ r.p.answers[r.idx]=userText??''; if(ok) r.p.correct++; else r.wrongs.push({item, ans, user:userText}); }
  r.phase='feedback'; renderRunner();
}
function markRight(){ const r=state.runner; r.last.ok=true; r.p.correct++; r.wrongs=r.wrongs.filter(w=>w.item!==r.items[r.idx]); renderRunner(); }
function nextItem(){ const r=state.runner; r.idx++; r.phase='answer'; r.tmp={}; if(!r.exam){ r.p.done=r.idx; persist(); } renderRunner(); }
function skipItem(){ const r=state.runner; if(!r.p.skipped.includes(r.idx)) r.p.skipped.push(r.idx); nextItem(); }
function checkItem(){ const r=state.runner, type=r.exam?'exam':r.block; ITEM[type].check(r.items[r.idx], r); }
var renderComplete = function(){
  const r=state.runner;
  if(r.exam){
    const byGp={}; r.examAnswers.forEach(({item,ok})=>{ const g=item.gp||'其他'; byGp[g]=byGp[g]||{n:0,ok:0}; byGp[g].n++; if(ok) byGp[g].ok++; });
    const score=Math.round(r.examAnswers.filter(a=>a.ok).length/r.items.length*100);
    const rec={score,byGp:Object.fromEntries(Object.entries(byGp).map(([g,v])=>[g,Math.round(v.ok/v.n*100)])),date:new Date().toISOString().slice(0,10)};
    if(r.testId==='weekly'){ state.tests.weekly=state.tests.weekly||{}; state.tests.weekly[r.week]=rec; } else state.tests[r.testId]=rec; persist();
    return `<div class="r-head"><div class="row"><span></span><span class="title">${esc(r.title)}</span><span></span></div></div>
    <div class="r-body"><div class="done-box"><div class="big">${score}%</div><div class="muted">${r.items.length} 題</div></div>
      <h2>各文法點正確率</h2>${Object.entries(rec.byGp).map(([g,p])=>`<div class="gp ${p<70?'low':''}"><span>${esc(g)}</span><span>${p}%</span></div>`).join('')}
      <p class="muted small">低於 70% 的文法點就是該回頭補的。</p>
      ${r.testId==='weekly'?`<div class="note">${score>=80?'≥80%，進下一週':score>=60?'60–79%，做完 Day 7 再考一次':'<60%，重做 Day 2–4 再考'}</div>`:''}
    </div>
    <div class="r-foot"><button class="primary" onclick="closeRunner()">回檢測</button></div>`;
  }
  const answered=r.items.length-r.p.skipped.length, pct=answered?Math.round(r.p.correct/answered*100):null, mins=Math.max(1,Math.round((Date.now()-r.startedAt)/60000));
  const grading = !['vocab_new','speaking','writing'].includes(r.block);

  try{

    const rec = new MediaRecorder(stream), chunks=[];

    rec.onstop=()=>{ stream.getTracks().forEach(t=>t.stop()); r.tmp.recording=false; r.tmp.url=URL.createObjectURL(new Blob(chunks,{type:rec.mimeType||'audio/webm'})); renderRunner(); };

  }catch(e){ toast('無法使用麥克風：'+e.message); }

const RJ = (()=>{ const m={}; const add=(s)=>s.split(' ').forEach(p=>{const [k,v]=p.split('='); m[k]=v;});
  add('きゃ=kya きゅ=kyu きょ=kyo しゃ=sha しゅ=shu しょ=sho ちゃ=cha ちゅ=chu ちょ=cho にゃ=nya にゅ=nyu にょ=nyo ひゃ=hya ひゅ=hyu ひょ=hyo みゃ=mya みゅ=myu みょ=myo りゃ=rya りゅ=ryu りょ=ryo ぎゃ=gya ぎゅ=gyu ぎょ=gyo じゃ=ja じゅ=ju じょ=jo びゃ=bya びゅ=byu びょ=byo ぴゃ=pya ぴゅ=pyu ぴょ=pyo ふぁ=fa てぃ=ti でぃ=di');
  add('あ=a い=i う=u え=e お=o か=ka き=ki く=ku け=ke こ=ko さ=sa し=shi す=su せ=se そ=so た=ta ち=chi つ=tsu て=te と=to な=na に=ni ぬ=nu ね=ne の=no は=ha ひ=hi ふ=fu へ=he ほ=ho ま=ma み=mi む=mu め=me も=mo や=ya ゆ=yu よ=yo ら=ra り=ri る=ru れ=re ろ=ro わ=wa を=o ん=n が=ga ぎ=gi ぐ=gu げ=ge ご=go ざ=za じ=ji ず=zu ぜ=ze ぞ=zo だ=da ぢ=ji づ=zu で=de ど=do ば=ba び=bi ぶ=bu べ=be ぼ=bo ぱ=pa ぴ=pi ぷ=pu ぺ=pe ぽ=po ぁ=a ぃ=i ぅ=u ぇ=e ぉ=o ゔ=vu');
  return m; })();
function toHira(s){ return [...s].map(c=>{ const o=c.charCodeAt(0); return (o>=0x30A1&&o<=0x30F6)? String.fromCharCode(o-0x60):c; }).join(''); }
function romaji(kana, tok){
  if(tok==='は') return 'wa'; if(tok==='へ') return 'e'; if(tok==='を') return 'o';
  const s=toHira(kana); let out='', dbl=false;
  for(let i=0;i<s.length;i++){
    const two=s.substr(i,2), one=s[i];
    if(one==='っ'){ dbl=true; continue; }
    if(one==='ー'){ const v=out.match(/[aeiou]$/); out+= v?v[0]:''; continue; }
    if(one==='ん'){ out += /^[あいうえおやゆよ]/.test(s[i+1]||'') ? "n'" : 'n'; continue; }
    let r = RJ[two] ? (i++, RJ[two]) : (RJ[one] ?? one);
    if(dbl){ r = (r.startsWith('ch')?'t':r[0]) + r; dbl=false; }
    out+=r;
  }
  return out;
}
function rubyTok(t, r){
  const mode=state.settings.jaScript;
  if(!r || r===t) return esc(t);
  if(mode==='kana') return esc(r);
  // 去掉相同的前後綴假名，只在漢字部分標音
  let a=0; while(a<t.length && a<r.length && t[a]===r[a]) a++;
  let b=0; while(b<t.length-a && b<r.length-a && t[t.length-1-b]===r[r.length-1-b]) b++;
  const pre=t.slice(0,a), mid=t.slice(a,t.length-b), suf=t.slice(t.length-b), rmid=r.slice(a,r.length-b);
  if(!mid) return esc(t);
  return `${esc(pre)}<ruby>${esc(mid)}<rt>${esc(rmid)}</rt></ruby>${esc(suf)}`;
}

function jaLine(toks, opt={}){
  // toks: [[t,r]|null]; opt.tap: 可點擊；opt.blank: 空格 html

    if(tk===null) return `<span class="jtok">${opt.blank||'<span class="blank">&nbsp;</span>'}</span>`;
    const [t,r]=tk; const inner=rubyTok(t,r);
    if(PUNCT.includes(t)) return `<span>${esc(t)}</span>`;
    if(opt.tap) return `<span class="jtok w ${opt.saved&&opt.saved(t)?'saved':''}" data-ja="${esc(t)}" data-i="${i}">${inner}</span>`;
    return `<span class="jtok">${inner}</span>`;
  }).join('');
  const rom = state.settings.jaScript==='romaji' ? `<div class="romaji">${toks.filter(Boolean).filter(x=>!PUNCT.includes(x[0])).map(([t,r])=>romaji(r||t,t)).join(' ')}</div>` : '';
  return `<span class="${gap?'jgap':''}">${html}</span>${rom}`;
}

  const sw = `<div class="langsw"><button class="${state.lang==='en'?'sel':''}" onclick="setLang('en')">English</button><button class="${state.lang==='ja'?'sel':''}" onclick="setLang('ja')">日本語 N5</button></div>`;
  const B = BLOCKS; window.BLOCKS_SAVED = B;
  let html;
  if(state.lang==='ja'){
    const _b = BLOCKS.splice(0, BLOCKS.length, ...BLOCKS_JA);
    try{ html=_renderHome(); } finally { BLOCKS.splice(0, BLOCKS.length, ..._b); }
    const jd=((DATA.ja||{}).days||{})[String(state.day)];
    if(jd) html=html.replace(/(<div class="muted">[^<]*?)　[^<]*?(<span|<\/div>)/, `$1　${esc(jd.topic)}$2`);
    html=html.replace(/\/11 區塊完成/, `/${BLOCKS_JA.length} 區塊完成`).replace('今天 11 個區塊都完成了', `今天 ${BLOCKS_JA.length} 個日文區塊都完成了`);
  } else html=_renderHome();
  return html.replace('<div class="screen">', '<div class="screen">'+sw);
};
const _startBlock = startBlock;
startBlock = function(day, blockId){
  if(!blockId.startsWith('ja_')) return _startBlock(day, blockId);
  const items=itemsFor(day, blockId); if(!items.length) return;
  const b=BLOCKS_JA.find(x=>x.id===blockId);
  let its=[...items];
  if(blockId==='ja_reorder') its=its.map(it=>Object.assign({}, it, {tiles: shuffleTiles(it)}));
  openRunner({day, block:blockId, title:'日文 '+b.name, items:its, exam:false});
};
function shuffleTiles(it){
  const toks=it.toks.filter(t=>!PUNCT.includes(t[0])); const all=[...toks, ...(it.extra||[])].map((t,i)=>({t,i}));
  for(let k=all.length-1;k>0;k--){ const j=Math.floor(Math.random()*(k+1)); [all[k],all[j]]=[all[j],all[k]]; }
  return all.map(x=>x.t);
}
const _dayCompletion = dayCompletion;
dayCompletion = function(day){
  let tot=0, done=0;
  curBlocks().forEach(b=>{ const n=itemsFor(day,b.id).length; if(!n) return; tot+=n; done+=Math.min(n,((state.progress[day]||{})[b.id]||{done:0}).done); });
  return tot? done/tot : null;
};

  const K='ABCD';
  return `<div class="opts">${opts.map((o,i)=>{ const tk=jaTok1(o);

}

/* ---------- 生字本（間隔重複：1、2、4、7、15、30 天） ---------- */
const SRS_INT=[0,1,2,4,7,15,30];
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(n){ const d=new Date(); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function isSaved(lang,w){ return !!(state.words[lang]||{})[w]; }
function toggleSave(lang,w,ex){
  state.words[lang]=state.words[lang]||{};
  if(state.words[lang][w]) delete state.words[lang][w]; else state.words[lang][w]={added:todayStr(), box:0, due:todayStr(), ex:ex||''};
  persist();
}
function srsGrade(lang,w,ok){ const e=(state.words[lang]||{})[w]; if(!e) return; e.box = ok? Math.min(SRS_INT.length-1, e.box+1) : 0; e.due = addDays(ok? SRS_INT[e.box] : 1); persist(); }
function dueWords(lang){ const t=todayStr(); return Object.entries(state.words[lang]||{}).filter(([w,e])=>e.due<=t).map(([w])=>w); }
function startSrs(lang){
  const due=dueWords(lang); if(!due.length) return toast('目前沒有到期的生字');
  const G=DATA.gloss[lang]; const all=Object.keys(G);
  const items=due.slice(0,30).map(w=>{ const g=G[w]||{zh:'?'}; const others=all.filter(x=>x!==w && G[x].zh && G[x].zh!==g.zh);
    const opts=[g.zh]; while(opts.length<4 && others.length){ const o=G[others.splice(Math.floor(Math.random()*others.length),1)[0]].zh; if(!opts.includes(o)) opts.push(o); }
    for(let k=opts.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1)); [opts[k],opts[j]]=[opts[j],opts[k]];}
    return {lang,w,g,opts,a:opts.indexOf(g.zh),ex:state.words[lang][w].ex}; });
  openRunner({day:state.day, block:'srs', title: lang==='ja'?'日文生字複習':'英文生字複習', items, temp:true});
}

/* ---------- 閱讀時間 ---------- */
function addReadSec(n){ const t=todayStr(); state.readTime[t]=(state.readTime[t]||0)+n; }
setInterval(()=>{ if(state.reader && !document.hidden && Date.now()-(state.reader.lastAct||0) < 120000){ addReadSec(5); if(Math.random()<.2) persist(); const el=document.getElementById('rd-tm'); if(el) el.innerHTML=timerHTML(); } }, 5000);
function readMin(){ return Math.floor((state.readTime[todayStr()]||0)/60); }
function streak(){ let n=0; for(let i=0;i<400;i++){ const d=new Date(); d.setDate(d.getDate()-i); const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); if((state.readTime[k]||0)>=600) n++; else if(i>0) break; } return n; }
function timerHTML(){ const m=readMin(); return `今日 ${Math.min(m,99)}/10 分${m>=10?' ✓':''}`; }

/* ---------- 閱讀器 ---------- */
function openBook(lang,id,ch){
  const b=DATA.library[lang].find(x=>x.id===id); const pos=state.readPos[id]||{};
  state.reader={lang,b,ch: ch ?? Math.min(pos.ch||0, b.chapters.length-1), mode: pos.mode||'tr', cur:-1, playing:false, lastAct:Date.now()};
  document.getElementById('nav').classList.add('hidden'); document.getElementById('reader').classList.remove('hidden'); renderReader();
}
function closeReader(){ stopPlay(); persist(); state.reader=null; document.getElementById('reader').classList.add('hidden'); document.getElementById('nav').classList.remove('hidden'); render(); }
function setMode(m){ const R=state.reader; R.mode=m; R.lastAct=Date.now(); state.readPos[R.b.id]=Object.assign(state.readPos[R.b.id]||{}, {mode:m}); persist(); if(m==='listen'){ R.cur=Math.max(0,R.cur); renderReader(); startPlay(); } else { stopPlay(); renderReader(); } }
function renderReader(){
  const R=state.reader, b=R.b, c=b.chapters[R.ch], L=R.lang, el=document.getElementById('reader');
  const trOn = R.mode==='tr' || R.mode==='listen';
  const trKey = L==='en' ? (state.settings.trLang==='ja'?'ja':'zh') : (state.settings.trLang==='en'?'en':'zh');
  const sents = c.s.map((s,i)=>{
    const tr = trOn ? `<div class="tr ${trKey==='ja'?'jp':''}">${esc(s[trKey]||s.zh)}</div>` : '';
    const tx = L==='en' ? `<div class="tx">${enTokens(s.t)}</div>` : `<div class="tx jp">${jaLine(s.toks,{tap:true,saved:w=>isSaved('ja',w)})}</div>`;
    return `<div class="sent ${i===R.cur?'cur':''}" id="s${i}" data-i="${i}">${tr}${tx}<button class="sp" onclick="playOne(${i})" aria-label="朗讀這句">🔊</button></div>`;
  }).join('');
  const last = R.ch>=b.chapters.length-1;
  el.style.setProperty('--rdfs', state.settings.rdfs+'px');
  el.innerHTML = `
    <div class="rd-head"><button onclick="closeReader()" aria-label="離開">✕</button>
      <div class="t">${L==='ja'?rubyTok(b.title,b.reading):esc(b.title)}<small>第 ${R.ch+1}／${b.chapters.length} 章　${b.level}</small></div>
      <button onclick="cycleFont()" aria-label="字級" style="font-family:var(--serif);font-weight:700">Aa</button></div>
    <div class="modes"><button class="${R.mode==='read'?'sel':''}" onclick="setMode('read')">📖 閱讀</button><button class="${R.mode==='listen'?'sel':''}" onclick="setMode('listen')">🎧 收聽</button><button class="${R.mode==='tr'?'sel':''}" onclick="setMode('tr')">🌐 翻譯</button></div>
    <div class="rd-body" id="rd-body">
      <div class="chap-t ${L==='ja'?'jp':''}">${L==='ja'?rubyTok(c.title,c.reading):esc(c.title)}</div><div class="chap-s">${esc(c.zh)}　·　點單字看${L==='en'?'中、日文':'中、英文'}與發音</div>
      ${sents}
      <div class="rd-end">
        <button class="primary" onclick="chapterQuiz()">讀完了，做 ${c.qs.length} 題理解題</button>
        <div class="daynav">${R.ch>0?`<button class="ghost" onclick="gotoCh(${R.ch-1})">‹ 上一章</button>`:'<span></span>'}${!last?`<button class="ghost" onclick="gotoCh(${R.ch+1})">下一章 ›</button>`:'<span></span>'}</div>
        <div class="muted small" style="margin-top:8px">翻譯語言：${L==='en'?`<button class="ghost" onclick="setTr('zh')" ${trKey==='zh'?'style="text-decoration:underline"':''}>中文</button><button class="ghost" onclick="setTr('ja')" ${trKey==='ja'?'style="text-decoration:underline"':''}>日本語</button>`:`<button class="ghost" onclick="setTr('zh')" ${trKey==='zh'?'style="text-decoration:underline"':''}>中文</button><button class="ghost" onclick="setTr('en')" ${trKey==='en'?'style="text-decoration:underline"':''}>English</button>`}</div>
      </div>
    </div>
    <div class="player"><div>
      <button onclick="stepSent(-1)" aria-label="上一句">⏮</button>
      <button class="pp" onclick="togglePlay()" aria-label="播放">${R.playing?'⏸':'▶'}</button>
      <button onclick="stepSent(1)" aria-label="下一句">⏭</button>
      <button class="spd" onclick="cycleRate()">${state.settings.rdRate}×</button>
      <div class="tm" id="rd-tm">${timerHTML()}</div>
    </div></div>`;
  const body=document.getElementById('rd-body');
  body.onclick = e => { R.lastAct=Date.now(); const w=e.target.closest('.w'); if(!w) return;
    const si=+w.closest('.sent').dataset.i; const sent=c.s[si];
    if(L==='en') openSheet('en', w.dataset.en, sent.t, w); else openSheet('ja', w.dataset.ja, jaText(sent.toks), w); };
  body.onscroll = ()=>{ R.lastAct=Date.now(); };
}
function enTokens(t){
  return t.split(/([A-Za-z]+(?:'[a-z]+)?)/).map((p,i)=>{
    if(i%2===0) return esc(p);
    const k=p.toLowerCase(); if(!DATA.gloss.en[k]) return esc(p);
    return `<span class="w ${isSaved('en',k)?'saved':''}" data-en="${esc(k)}">${esc(p)}</span>`;
  }).join('');
}
function gotoCh(i){ stopPlay(); const R=state.reader; R.ch=i; R.cur=-1; state.readPos[R.b.id]=Object.assign(state.readPos[R.b.id]||{}, {ch:i}); persist(); renderReader(); document.getElementById('rd-body').scrollTop=0; }
function setTr(k){ state.settings.trLang=k; persist(); renderReader(); }
function cycleFont(){ const s=[18,20,22,25,28]; const i=s.indexOf(state.settings.rdfs); state.settings.rdfs=s[(i+1)%s.length]; persist(); renderReader(); }
function cycleRate(){ const s=[0.6,0.75,0.9,1.0]; const i=s.indexOf(state.settings.rdRate); state.settings.rdRate=s[(i+1)%s.length]; persist(); renderReader(); }
function sentText(i){ const R=state.reader, s=R.b.chapters[R.ch].s[i]; return R.lang==='en'? s.t.replace(/["“”]/g,'') : jaText(s.toks); }
function markCur(i){ const R=state.reader; R.cur=i; document.querySelectorAll('#reader .sent').forEach(e=>e.classList.toggle('cur', +e.dataset.i===i)); const el=document.getElementById('s'+i); if(el) el.scrollIntoView({block:'center',behavior: matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'}); }
function speakSent(i, onend){ const R=state.reader; R.lastAct=Date.now(); markCur(i); const t=sentText(i); (R.lang==='en'?TTS.speakEn:TTS.speakJa).call(TTS, t, state.settings.rdRate, onend); }
function playOne(i){ stopPlay(); speakSent(i); }
function startPlay(){ const R=state.reader; R.playing=true; const n=R.b.chapters[R.ch].s.length; const run=(i)=>{ if(!state.reader||!R.playing) return; if(i>=n){ R.playing=false; renderPlayerBtn(); return; } speakSent(i, ()=>{ if(R.playing) setTimeout(()=>run(i+1), 350); }); }; run(Math.max(0,R.cur)); renderPlayerBtn(); }
function stopPlay(){ const R=state.reader; if(R) R.playing=false; try{speechSynthesis.cancel();}catch(e){} renderPlayerBtn(); }
function togglePlay(){ const R=state.reader; if(R.playing) stopPlay(); else { if(R.cur<0) R.cur=0; startPlay(); } }
function stepSent(d){ const R=state.reader; const n=R.b.chapters[R.ch].s.length; const i=Math.min(n-1,Math.max(0,(R.cur<0?0:R.cur)+d)); const was=R.playing; stopPlay(); R.cur=i; if(was){ startPlay(); } else speakSent(i); }
function renderPlayerBtn(){ const b=document.querySelector('#reader .pp'); if(b&&state.reader) b.textContent=state.reader.playing?'⏸':'▶'; }
function chapterQuiz(){
  stopPlay(); const R=state.reader, c=R.b.chapters[R.ch];
  const done=new Set((state.readPos[R.b.id]||{}).done||[]); done.add(R.ch); state.readPos[R.b.id]=Object.assign(state.readPos[R.b.id]||{}, {done:[...done]}); persist();
  const items=c.qs.map(q=>Object.assign({lang:R.lang}, q));
  document.getElementById('reader').classList.add('hidden');
  openRunner({day:state.day, block:'rd_q', title:'理解題', items, temp:true, back:'reader'});
}
const _closeRunner = closeRunner;
closeRunner = function(){ const back = state.runner && state.runner.back; _closeRunner(); if(back==='reader' && state.reader){ document.getElementById('nav').classList.add('hidden'); document.getElementById('reader').classList.remove('hidden'); renderReader(); } };

/* ---------- 單字面板 ---------- */
function openSheet(lang, w, sentence, node){
  if(state.reader) state.reader.lastAct=Date.now();
  document.querySelectorAll('.w.on').forEach(e=>e.classList.remove('on')); if(node) node.classList.add('on');
  const g=(DATA.gloss[lang]||{})[w]; const sh=document.getElementById('sheet');
  if(!g){ toast('這個字還沒有詞彙資料'); return; }
  const saved=isSaved(lang,w); const q=JSON.stringify(w).replace(/"/g,'&quot;'); const sq=JSON.stringify(sentence||'').replace(/"/g,'&quot;');
  let body;
  if(lang==='en'){
    body=`<div class="hw">${esc(w)}</div><div class="ph">${g.ipa?`/${esc(g.ipa)}/　`:''}${esc(g.pos)}</div>
      <div class="spkrow" style="margin:0 0 6px"><button class="spk" onclick="TTS.speakEn(${q})">🔊 發音</button><button class="spk" onclick="TTS.speakEn(${q},0.55)">🐢 慢速</button></div>
      <div class="line"><span class="k">中文</span><span class="v">${esc(g.zh)}</span><span></span></div>
      <div class="line"><span class="k">日本語</span><span class="v jp">${rubyTok(g.ja[0],g.ja[1])}${g.ja[1]?`<div class="romaji" style="font-size:13px">${esc(romaji(g.ja[1]))}</div>`:''}</span><button class="mini-spk" onclick="TTS.speakJa(${JSON.stringify(g.ja[0]).replace(/"/g,'&quot;')})">🔊</button></div>`;
  } else {
    body=`<div class="hw jp">${rubyTok(w,g.r)}</div><div class="ph">${esc(romaji(g.r||w, w))}${g.pos?'　'+esc(g.pos):''}</div>
      <div class="spkrow" style="margin:0 0 6px"><button class="spk" onclick="TTS.speakJa(${q})">🔊 發音</button><button class="spk" onclick="TTS.speakJa(${q},0.55)">🐢 慢速</button></div>
      <div class="line"><span class="k">中文</span><span class="v">${esc(g.zh)}</span><span></span></div>
      <div class="line"><span class="k">English</span><span class="v" style="font-family:var(--serif)">${esc(g.en)}</span><button class="mini-spk" onclick="TTS.speakEn(${JSON.stringify((g.en||'').replace(/\(.*?\)/g,'').split(';')[0]).replace(/"/g,'&quot;')})">🔊</button></div>`;
  }
  sh.innerHTML = `<div class="sh" role="dialog" aria-label="單字">${'<div class="grab"></div>'}${body}
    ${g.note?`<div class="note small">${esc(g.note)}</div>`:''}
    ${sentence?`<div class="ex ${lang==='ja'?'jp':''}">${esc(sentence)}</div>`:''}
    <div class="acts"><button class="${saved?'secondary':'primary'}" onclick="toggleSave('${lang}',${q},${sq});closeSheet();if(state.reader)renderReader();else render()">${saved?'從生字本移除':'加入生字本'}</button><button class="secondary" onclick="closeSheet()">關閉</button></div></div>`;
  sh.classList.remove('hidden');
  (lang==='en'?TTS.speakEn:TTS.speakJa).call(TTS, w);
}
function closeSheet(){ document.getElementById('sheet').classList.add('hidden'); document.querySelectorAll('.w.on').forEach(e=>e.classList.remove('on')); }
document.getElementById('sheet').addEventListener('click', e=>{ if(e.target.id==='sheet') closeSheet(); });
document.getElementById('runner').addEventListener('click', e=>{ const w=e.target.closest('.w[data-ja]'); if(w){ openSheet('ja', w.dataset.ja, ''); } });

/* ---------- 路由與設定 ---------- */
render = function(){
  const app=document.getElementById('app');
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on', b.dataset.s===state.screen));
  app.innerHTML = {home:renderHome, read:renderRead, progress:renderProgress, tests:renderTests, settings:renderSettings}[state.screen]();
};
const _renderSettings = renderSettings;
renderSettings = function(){
  const s=state.settings;
  const ja = `<h2>日文</h2><ul class="list">
    <li><label><span><div>日文顯示</div><div class="sub">漢字上方標注假名</div></span><span class="seg">${[['furigana','注音'],['kana','只用假名'],['romaji','＋拼音']].map(([k,l])=>`<button class="${s.jaScript===k?'sel':''}" onclick="state.settings.jaScript='${k}';persist();render()">${l}</button>`).join('')}</span></label></li>
    <li><label><span><div>詞間空格</div><div class="sub">初學時把字詞分開比較好讀</div></span><span class="seg"><button class="${s.jaGap?'sel':''}" onclick="state.settings.jaGap=true;persist();render()">開</button><button class="${!s.jaGap?'sel':''}" onclick="state.settings.jaGap=false;persist();render()">關</button></span></label></li>
    <li><label><span><div>日文語音</div><div class="sub">${TTS.jvoices.length?'':'系統沒有日文語音：iOS 設定→輔助使用→朗讀內容→聲音→日文'}</div></span>
      <select class="sel-input" onchange="state.settings.jaVoice=this.value;persist();TTS.speakJa('桃太郎は川へ行きました。')">${TTS.jvoices.length? TTS.jvoices.map(v=>`<option ${v.name===s.jaVoice?'selected':''} value="${esc(v.name)}">${esc(v.name)}</option>`).join('') : '<option>（無）</option>'}</select></label></li>
    </ul>`;
  return _renderSettings().replace('<h2>題庫</h2>', ja+'<h2>題庫</h2>');
};
document.querySelector('#nav button[data-s="progress"]').insertAdjacentHTML('beforebegin','<button data-s="read">閱讀</button>');
render();

</script>
</body>
</html>
